org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Disabled while chasing a persistent Windows file-lock error during
# cleanMergeDebugAssets — the Gradle daemon is a long-lived background
# process that can hold file handles open between builds. Safe to remove
# this line later (builds will just be a few seconds slower per run).
org.gradle.daemon=false
# Also disabled while chasing the same issue: Gradle's file-system watcher
# keeps a live handle on its own output folders to speed up future builds,
# which is a known cause of "Unable to delete directory" on Windows.
org.gradle.vfs.watch=false
# Force Gradle to use Android Studio's own bundled JDK instead of whatever
# Java is on the system PATH (which is Java 25 here — much newer than what
# Gradle/Android Gradle Plugin are actually tested against, and a likely
# cause of the persistent "Unable to delete directory" build failures).
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
